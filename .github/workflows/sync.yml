name: sync-upstream-spec

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: sync-upstream-spec
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: Mic92/hestia@v3

      - name: Check upstream OpenAPI spec for changes
        id: spec
        run: |
          curl -sL --fail https://docs.mistral.ai/openapi.yaml -o openapi.new.yaml
          python3 scripts/normalize_spec.py openapi.new.yaml
          echo "sha256=$(sha256sum openapi.new.yaml | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          if cmp -s openapi.new.yaml openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv openapi.new.yaml openapi.yaml
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate SDK
        if: steps.spec.outputs.changed == 'true'
        run: nix develop -c make generate

      - name: Test
        id: test
        if: steps.spec.outputs.changed == 'true'
        run: |
          nix develop -c make test
          echo "live=$([ -n "$MISTRAL_API_KEY" ] && echo ran || echo skipped)" >> "$GITHUB_OUTPUT"
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Open pull request
        if: steps.spec.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_TESTS: ${{ steps.test.outputs.live }}
          SPEC_SHA256: ${{ steps.spec.outputs.sha256 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=sync/upstream-openapi
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: sync SDK from upstream openapi.yaml"
          git push --force origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json url -q .url > /dev/null 2>&1; then
            gh pr create --head "$BRANCH" --title "chore: sync SDK from upstream openapi.yaml" \
              --body "Regenerated from the published Mistral spec at docs.mistral.ai/openapi.yaml (spec sha256: $SPEC_SHA256). Tests: go test ./... (live streaming test $LIVE_TESTS)."
          fi
