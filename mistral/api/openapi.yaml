          nullable: true
          type: array
          default: null
        prompt_cache_key:
          description: "A cache key to enable prompt caching. When provided, the API\
            \ will attempt to reuse previously computed tokens for requests sharing\
            \ the same prefix (e.g. multi-turn conversations or requests with a similar\
            \ system prompt). Cached tokens are billed at 10% of the standard input\
            \ token price."
          nullable: true
          type: string
        safe_prompt:
          default: false
          description: Whether to inject a safety prompt before all conversations.
          type: boolean
