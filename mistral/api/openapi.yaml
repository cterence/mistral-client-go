          description: "Execution ID of the parent workflow that initiated this execution.\
            \ If this is a root workflow, this field is not set."
          nullable: true
          type: string
        workflow_exec_id:
          description: Execution ID of the workflow that emitted this event.
          title: Workflow Exec Id
          type: string
        workflow_run_id:
          description: Run ID of the workflow execution. Changes on continue-as-new
            while workflow_exec_id stays the same.
          title: Workflow Run Id
          type: string
        workflow_name:
          description: The registered name of the workflow that emitted this event.
          title: Workflow Name
          type: string
        event_type:
          default: WORKFLOW_TASK_FAILED
          description: Event type discriminator.
          enum:
          - WORKFLOW_TASK_FAILED
          title: Event Type
          type: string
        attributes:
          allOf:
          - $ref: "#/components/schemas/WorkflowTaskFailedAttributes"
          description: Event-specific attributes.
      required:
      - attributes
      - event_id
      - event_timestamp
      - event_type
      - parent_workflow_exec_id
      - root_workflow_exec_id
      - workflow_exec_id
      - workflow_name
      - workflow_run_id
      title: WorkflowTaskFailed
    WorkflowTaskFailedAttributes:
      description: Attributes for workflow task failed events.
      properties:
        task_id:
          description: Unique identifier for the task within the workflow execution.
          title: Task Id
          type: string
        failure:
          allOf:
          - $ref: "#/components/schemas/Failure"
          description: Details about the failure that caused the task to fail.
      required:
      - failure
      - task_id
      title: WorkflowTaskFailedAttributes
    WorkflowTaskTimedOutResponse:
      description: |-
        Emitted when a workflow task times out.

        This indicates the workflow task (a unit of workflow execution) exceeded
        its configured timeout.
      properties:
        event_id:
          description: Unique identifier for this event instance.
          title: Event Id
          type: string
        event_timestamp:
          description: Unix timestamp in nanoseconds when the event was created.
          title: Event Timestamp
          type: integer
        root_workflow_exec_id:
          description: Execution ID of the root workflow that initiated this execution
