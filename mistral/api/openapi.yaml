  /v1/workflows/{workflow_name}/metrics:
    get:
      description: |-
        Get comprehensive metrics for a specific workflow.

        Args:
            workflow_name: The name of the workflow type to get metrics for
            start_time: Optional start time filter (ISO 8601 format)
            end_time: Optional end time filter (ISO 8601 format)

        Returns:
            WorkflowMetrics: Dictionary containing metrics:
                - execution_count: Total number of executions
                - success_count: Number of successful executions
                - error_count: Number of failed/terminated executions
                - average_latency_ms: Average execution duration in milliseconds
                - retry_rate: Proportion of workflows with retries
                - latency_over_time: Time-series data of execution durations

        Example:
            GET /v1/workflows/MyWorkflow/metrics
            GET /v1/workflows/MyWorkflow/metrics?start_time=2025-01-01T00:00:00Z
            GET /v1/workflows/MyWorkflow/metrics?start_time=2025-01-01T00:00:00Z&end_time=2025-12-31T23:59:59Z
      operationId: get_workflow_metrics_v1_workflows__workflow_name__metrics_get
      parameters:
      - explode: false
        in: path
        name: workflow_name
        required: true
        schema:
          title: Workflow Name
          type: string
        style: simple
      - description: Filter workflows started after this time (ISO 8601)
        explode: true
        in: query
        name: start_time
        required: false
        schema:
          description: Filter workflows started after this time (ISO 8601)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Filter workflows started before this time (ISO 8601)
        explode: true
        in: query
        name: end_time
        required: false
        schema:
          description: Filter workflows started after this time (ISO 8601)
          format: date-time
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowMetrics"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Workflow Metrics
      tags:
      - beta.workflows.metrics
