            of functions the model may generate JSON inputs for.
          items:
            $ref: "#/components/schemas/Tool"
          nullable: true
          type: array
          default: null
        tool_choice:
          $ref: "#/components/schemas/Tool_Choice"
        presence_penalty:
          default: 0.0
          description: "The `presence_penalty` determines how much the model penalizes\
            \ the repetition of words or phrases. A higher presence penalty encourages\
            \ the model to use a wider variety of words and phrases, making the output\
            \ more diverse and creative."
          maximum: 2
          minimum: -2
          title: Presence Penalty
          type: number
        frequency_penalty:
          default: 0.0
          description: "The `frequency_penalty` penalizes the repetition of words\
            \ based on their frequency in the generated text. A higher frequency penalty\
            \ discourages the model from repeating words that have already appeared\
            \ frequently in the output, promoting diversity and reducing repetition."
          maximum: 2
          minimum: -2
          title: Frequency Penalty
          type: number
        "n":
          description: "Number of completions to return for each request, input tokens\
            \ are only billed once."
          minimum: 1
          nullable: true
          type: integer
        prediction:
          allOf:
          - $ref: "#/components/schemas/Prediction"
          default:
            type: content
            content: ""
          description: "Enable users to specify expected results, optimizing response\
            \ times by leveraging known or predictable content. This approach is especially\
            \ effective for updating text documents or code files with minimal changes,\
            \ reducing latency while maintaining high-quality results."
        parallel_tool_calls:
          default: true
          description: "Whether to enable parallel function calling during tool use,\
            \ when enabled the model can call multiple tools in parallel."
          title: Parallel Tool Calls
          type: boolean
        prompt_mode:
          allOf:
