openapi: 3.1.0
info:
  description: "Our Chat Completion and Embeddings APIs specification. Create your\
    \ account on [La Plateforme](https://console.mistral.ai) to get access and read\
    \ the [docs](https://docs.mistral.ai) to learn how to use it."
  title: Mistral AI API
  version: 1.0.0
servers:
- description: Production server
  url: https://api.mistral.ai
security:
- ApiKey: []
tags:
- description: Chat Completion API.
  name: chat
  x-displayName: Chat
- description: Fill-in-the-middle API.
  name: fim
  x-displayName: FIM
- description: Agents API.
  name: agents
  x-displayName: Agents
- description: Embeddings API.
  name: embeddings
  x-displayName: Embeddings
- description: Classifiers API.
  name: classifiers
  x-displayName: Classifiers
- description: Files API
  name: files
  x-displayName: Files
- description: (deprecated) Agents completion API
  name: deprecated.agents
  x-displayName: (deprecated) Agents
- description: (deprecated) Fine-tuning API
  name: deprecated.fine-tuning
  x-displayName: (deprecated) Fine Tuning
- description: Model Management API
  name: models
  x-displayName: Models
- description: Batch API
  name: batch
  x-displayName: Batch
- description: OCR API
  name: ocr
  x-displayName: OCR API
- description: API for audio transcription.
  name: audio.transcriptions
  x-displayName: Transcriptions API
- description: API for text-to-speech generation.
  name: audio.speech
  x-displayName: Speech API
- description: API for managing custom voice profiles.
  name: audio.voices
  x-displayName: Voices API
- description: (beta) Agents API
  name: beta.agents
  x-displayName: (beta) Agents API
- description: (beta) Conversations API
  name: beta.conversations
  x-displayName: (beta) Conversations API
- description: (beta) Libraries API to create and manage libraries - index your documents
    to enhance agent capabilities.
  name: beta.libraries
  x-displayName: (beta) Libraries  API - Main
- description: (beta) Libraries API - manage documents in a library.
  name: beta.libraries.documents
  x-displayName: (beta) Libraries  API - Documents
- description: (beta) Libraries API - manage access to a library.
  name: beta.libraries.accesses
  x-displayName: (beta) Libraries  API - Access
- description: "(beta) Search, retrieve, and analyze chat completion events."
  name: beta.observability.chat_completion_events
  x-displayName: (beta) Observability - Chat completion events
- description: (beta) List and inspect filterable fields for chat completion events.
  name: beta.observability.chat_completion_events.fields
  x-displayName: (beta) Observability - Chat completion fields
- description: "(beta) Create, update, and manage judges for evaluating chat completions."
  name: beta.observability.judges
  x-displayName: (beta) Observability - Judges
- description: (beta) Create and manage evaluation campaigns.
  name: beta.observability.campaigns
  x-displayName: (beta) Observability - Campaigns
- description: "(beta) Create, update, import, and export datasets."
  name: beta.observability.datasets
  x-displayName: (beta) Observability - Datasets
- description: (beta) Manage individual records within datasets.
  name: beta.observability.datasets.records
  x-displayName: (beta) Observability - Dataset records
- description: Workflow management API.
  name: beta.workflows
  x-displayName: Workflows
- description: "Trigger, monitor, and control workflow executions."
  name: beta.workflows.executions
  x-displayName: Executions
- description: List and inspect individual workflow runs.
  name: beta.workflows.runs
  x-displayName: Runs
- description: Create and manage workflow schedules.
  name: beta.workflows.schedules
  x-displayName: Schedules
- description: List and inspect worker deployments.
  name: beta.workflows.deployments
  x-displayName: Deployments
- description: Stream and list workflow execution events.
  name: beta.workflows.events
  x-displayName: Events
- description: Get performance metrics for workflows.
  name: beta.workflows.metrics
  x-displayName: Metrics
- description: Worker connection info.
  name: beta.workflows.workers
  x-displayName: Workers
- description: (beta) Connectors
  name: beta.connectors
  x-displayName: (beta) Connectors
paths:
  /v1/models:
    get:
      description: List all models available to the user.
      operationId: list_models_v1_models_get
      parameters:
      - explode: true
        in: query
        name: provider
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: model
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                userExample:
                  value:
                  - id: <model_id>
                    capabilities:
                      completion_chat: true
                      completion_fim: false
                      function_calling: false
                      fine_tuning: false
                      vision: false
                      classification: false
                    job: <job_id>
                    root: open-mistral-7b
                    object: model
                    created: 1756746619
                    owned_by: <owner_id>
                    name: null
                    description: null
                    max_context_length: 32768
                    aliases: []
                    deprecation: null
                    deprecation_replacement_model: null
                    default_model_temperature: null
                    TYPE: fine-tuned
                    archived: false
              schema:
                $ref: "#/components/schemas/ModelList"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: List Models
      tags:
      - models
  /v1/models/{model_id}:
    delete:
      description: Delete a fine-tuned model.
      operationId: delete_model_v1_models__model_id__delete
      parameters:
      - description: The ID of the model to delete.
        example: ft:open-mistral-7b:587a6b29:20240514:7e773925
        explode: false
        in: path
        name: model_id
        required: true
        schema:
          title: Model Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              examples:
                userExample:
                  value:
                    id: ft:open-mistral-7b:587a6b29:20240514:7e773925
                    object: model
                    deleted: true
              schema:
                $ref: "#/components/schemas/DeleteModelOut"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete Model
      tags:
      - models
    get:
      description: Retrieve information about a model.
      operationId: retrieve_model_v1_models__model_id__get
      parameters:
      - description: The ID of the model to retrieve.
        example: ft:open-mistral-7b:587a6b29:20240514:7e773925
        explode: false
        in: path
        name: model_id
        required: true
        schema:
          title: Model Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              examples:
                userExample:
                  value:
                    id: <your_model_id>
                    capabilities:
                      completion_chat: true
                      completion_fim: false
                      function_calling: false
                      fine_tuning: false
                      vision: false
                      classification: false
                    job: <job_id>
                    root: open-mistral-7b
                    object: model
                    created: 1756746619
                    owned_by: <owner_id>
                    name: null
                    description: null
                    max_context_length: 32768
                    aliases: []
                    deprecation: null
                    deprecation_replacement_model: null
                    default_model_temperature: null
                    TYPE: fine-tuned
                    archived: false
              schema:
                $ref: "#/components/schemas/Response_Retrieve_Model_V1_Models__Model_Id__Get"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Retrieve Model
      tags:
      - models
  /v1/conversations:
    get:
      description: Retrieve a list of conversation entities sorted by creation time.
      operationId: agents_api_v1_conversations_list
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 100
          title: Page Size
          type: integer
        style: form
      - content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: {}
              - {}
              title: Metadata
        in: query
        name: metadata
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Response_V1_Conversations_List_inner"
                title: Response V1 Conversations List
                type: array
                default: null
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: List all created conversations.
      tags:
      - beta.conversations
    post:
      description: "Create a new conversation, using a base model or an agent and\
        \ append entries. Completion and tool executions are run and the response\
        \ is appended to the conversation.Use the returned conversation_id to continue\
        \ the conversation."
      operationId: agents_api_v1_conversations_start
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create a conversation and append entries to it.
      tags:
      - beta.conversations
  /v1/conversations/{conversation_id}:
    delete:
      description: Delete a conversation given a conversation_id.
      operationId: agents_api_v1_conversations_delete
      parameters:
      - description: ID of the conversation from which we are fetching metadata.
        explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          description: ID of the conversation from which we are fetching metadata.
          title: Conversation Id
          type: string
        style: simple
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete a conversation.
      tags:
      - beta.conversations
    get:
      description: Given a conversation_id retrieve a conversation entity with its
        attributes.
      operationId: agents_api_v1_conversations_get
      parameters:
      - description: ID of the conversation from which we are fetching metadata.
        explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          description: ID of the conversation from which we are fetching metadata.
          title: Conversation Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response_V1_Conversations_Get"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Retrieve a conversation information.
      tags:
      - beta.conversations
    post:
      description: Run completion on the history of the conversation and the user
        entries. Return the new created entries.
      operationId: agents_api_v1_conversations_append
      parameters:
      - description: ID of the conversation to which we append entries.
        explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          description: ID of the conversation to which we append entries.
          title: Conversation Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationAppendRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Append new entries to an existing conversation.
      tags:
      - beta.conversations
  /v1/conversations/{conversation_id}/history:
    get:
      description: "Given a conversation_id retrieve all the entries belonging to\
        \ that conversation. The entries are sorted in the order they were appended,\
        \ those can be messages, connectors or function_call."
      operationId: agents_api_v1_conversations_history
      parameters:
      - description: ID of the conversation from which we are fetching entries.
        explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          description: ID of the conversation from which we are fetching entries.
          title: Conversation Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistory"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Retrieve all entries in a conversation.
      tags:
      - beta.conversations
  /v1/conversations/{conversation_id}/messages:
    get:
      description: Given a conversation_id retrieve all the messages belonging to
        that conversation. This is similar to retrieving all entries except we filter
        the messages only.
      operationId: agents_api_v1_conversations_messages
      parameters:
      - description: ID of the conversation from which we are fetching messages.
        explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          description: ID of the conversation from which we are fetching messages.
          title: Conversation Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessages"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Retrieve all messages in a conversation.
      tags:
      - beta.conversations
  /v1/conversations/{conversation_id}/restart:
    post:
      description: "Given a conversation_id and an id, recreate a conversation from\
        \ this point and run completion. A new conversation is returned with the new\
        \ entries returned."
      operationId: agents_api_v1_conversations_restart
      parameters:
      - description: ID of the original conversation which is being restarted.
        explode: false
        in: path
        name: conversation_id
        required: true
        schema:
          description: ID of the original conversation which is being restarted.
          title: Conversation Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRestartRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Restart a conversation starting from a given entry.
      tags:
      - beta.conversations
  /v1/agents:
    get:
      deprecated: true
      description: "Retrieve a list of agent entities sorted by creation time. Deprecated:\
        \ some features such as agent sharing are not supported by this endpoint.\
        \ Use the cursor-paginated `GET /v1/agents/pages` instead."
      operationId: agents_api_v1_agents_list
      parameters:
      - description: Page number (0-indexed)
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          description: Page number (0-indexed)
          minimum: 0
          title: Page
          type: integer
        style: form
      - description: Number of agents per page
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          description: Number of agents per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        style: form
      - explode: true
        in: query
        name: deployment_chat
        required: false
        schema:
          description: "Filter by archived state. False=exclude archived, True=only\
            \ archived, None=include all"
          nullable: true
          type: boolean
        style: form
      - explode: true
        in: query
        name: sources
        required: false
        schema:
          items:
            $ref: "#/components/schemas/RequestSource"
          nullable: true
          type: array
          default: null
        style: form
      - description: Filter by agent name
        explode: true
        in: query
        name: name
        required: false
        schema:
          description: Filter by agent name
          nullable: true
          type: string
        style: form
      - description: Search agents by name or ID
        explode: true
        in: query
        name: search
        required: false
        schema:
          description: Filter by agent name
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: id
        required: false
        schema:
          description: Filter by agent name
          nullable: true
          type: string
        style: form
      - content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: true
                description: Output JSON schema of the query's model
                nullable: true
                type: object
              - {}
              title: Metadata
        in: query
        name: metadata
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Agent"
                title: Response V1 Agents List
                type: array
                default: null
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: List agent entities.
      tags:
      - beta.agents
      x-speakeasy-deprecation-message: Some features such as agent sharing are not
        supported by this endpoint.
      x-speakeasy-deprecation-replacement: v1_agents_list_pages
    post:
      description: "Create a new agent giving it instructions, tools, description.\
        \ The agent is then available to be used as a regular assistant in a conversation\
        \ or as part of an agent pool from which it can be used."
      operationId: agents_api_v1_agents_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create a agent that can be used within a conversation.
      tags:
      - beta.agents
  /v1/agents/{agent_id}:
    delete:
      operationId: agents_api_v1_agents_delete
      parameters:
      - explode: false
        in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
        style: simple
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete an agent entity.
      tags:
      - beta.agents
    get:
      description: "Given an agent, retrieve an agent entity with its attributes.\
        \ The agent_version parameter can be an integer version number or a string\
        \ alias."
      operationId: agents_api_v1_agents_get
      parameters:
      - explode: false
        in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
        style: simple
      - explode: true
        in: query
        name: agent_version
        required: false
        schema:
          $ref: "#/components/schemas/Agent_Version"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Retrieve an agent entity.
      tags:
      - beta.agents
    patch:
      description: Update an agent attributes and create a new version.
      operationId: agents_api_v1_agents_update
      parameters:
      - explode: false
        in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Update an agent entity.
      tags:
      - beta.agents
  /v1/agents/pages:
    get:
      description: "Retrieve a page of agent entities. Unlike the deprecated `GET\
        \ /v1/agents`, this endpoint paginates by opaque cursor and honors per-agent\
        \ sharing, returning only agents the caller is authorized to see."
      operationId: agents_api_v1_agents_list_pages
      parameters:
      - description: Number of agents per page
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          description: Number of agents per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        style: form
      - explode: true
        in: query
        name: deployment_chat
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      - explode: true
        in: query
        name: sources
        required: false
        schema:
          items:
            $ref: "#/components/schemas/RequestSource"
          nullable: true
          type: array
          default: null
        style: form
      - description: Filter by agent name
        explode: true
        in: query
        name: name
        required: false
        schema:
          description: Filter by agent name
          nullable: true
          type: string
        style: form
      - description: Search agents by name or ID
        explode: true
        in: query
        name: search
        required: false
        schema:
          description: Search agents by name or ID
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: true
              - {}
              title: Metadata
        in: query
        name: metadata
        required: false
      - description: "Opaque cursor from a previous response's next_page_token. When\
          \ set, results page forward from the cursor."
        explode: true
        in: query
        name: page_token
        required: false
        schema:
          description: Filter by agent name
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListPage"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: "List agent entities, cursor-paginated."
      tags:
      - beta.agents
      x-speakeasy-pagination:
        type: cursor
        inputs:
        - name: page_token
          in: parameters
          type: cursor
        - name: page_size
          in: parameters
          type: limit
        outputs:
          results: $.data
          nextCursor: $.next_page_token
  /v1/agents/{agent_id}/version:
    patch:
      description: Switch the version of an agent.
      operationId: agents_api_v1_agents_update_version
      parameters:
      - explode: false
        in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
        style: simple
      - explode: true
        in: query
        name: version
        required: true
        schema:
          title: Version
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Update an agent version.
      tags:
      - beta.agents
  /v1/agents/{agent_id}/versions:
    get:
      description: Retrieve all versions for a specific agent with full agent context.
        Supports pagination.
      operationId: agents_api_v1_agents_list_versions
      parameters:
      - explode: false
        in: path
