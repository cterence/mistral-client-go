            \ lower values like 0.2 will make it more focused and deterministic. We\
            \ generally recommend altering this or `top_p` but not both. The default\
            \ value varies depending on the model you are targeting. Call the `/models`\
            \ endpoint to retrieve the appropriate value."
          maximum: 1.5
          minimum: 0
          nullable: true
          type: number
        top_p:
          default: 1.0
          description: "Nucleus sampling, where the model considers the results of\
            \ the tokens with `top_p` probability mass. So 0.1 means only the tokens\
            \ comprising the top 10% probability mass are considered. We generally\
            \ recommend altering this or `temperature` but not both."
          maximum: 1
